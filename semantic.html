<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Semantic Tags</title>
</head>
<body>
    <header>
        <h1>My Site</h1>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <article>
            <h2>Article</h2>
            <p>Content here.</p>
            <section>
                <h3>Section</h3>
                <p>More content.</p>
            </section>
        </article>

        <aside>
            <h3>Aside</h3>
            <p>Side info.</p>
            <details>
                <summary>Click to see more</summary>
                <p>Hidden content.</p>
            </details>
        </aside>
    </main>

    <footer>
        <p>Copyright &copy; 2026</p>
    </footer>
</body>
</html>
