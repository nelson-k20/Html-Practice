<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tables</title>
</head>
<body>
    <h1>Tables</h1>

    <table border="1">
        <caption>Menu</caption>
        <colgroup>
            <col style="background-color: #f9e5e0;">
            <col span="2">
        </colgroup>
        <thead>
            <tr>
                <th scope="col">Item</th>
                <th scope="col">Qty</th>
                <th scope="col">Price</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="row" rowspan="2">Idli</th>
                <td>2 pcs</td>
                <td>₹30</td>
            </tr>
            <tr>
                <td>4 pcs</td>
                <td>₹55</td>
            </tr>
            <tr>
                <th scope="row">Dosa</th>
                <td>1 pc</td>
                <td>₹40</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3">Prices include GST</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
